<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>ScreenLive — displej</title>
<style>
  :root{
    --bg:#0b0d10;
    --fg:#eef1f4;
    --muted:#7b8794;
    --accent:#4fb286;
    --amber:#e2a53a;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:var(--bg);color:var(--fg);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}

  .setup{width:100%;max-width:420px;padding:28px;text-align:center;}
  .setup h1{font-size:20px;margin:0 0 4px;letter-spacing:.02em;}
  .setup p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 20px;}
  .setup label{display:block;text-align:left;font-size:12px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em;}
  .setup input{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2a3138;
    background:#12161a;color:var(--fg);font-size:16px;font-family:var(--mono);
  }
  .setup button{
    margin-top:22px;width:100%;padding:14px;border-radius:10px;border:none;
    background:var(--accent);color:#06110c;font-size:16px;font-weight:600;cursor:pointer;
  }
  .setup .err{color:#e0645c;font-size:13px;margin-top:12px;min-height:16px;}
  .badge{
    display:inline-block;margin-bottom:18px;padding:4px 10px;border-radius:999px;
    border:1px solid #2a3138;color:var(--muted);font-size:11px;font-family:var(--mono);
    letter-spacing:.05em;
  }

  #stage{position:fixed;inset:0;display:none;align-items:center;justify-content:center;}
  #stage.on{display:flex;}

  .w-clock{text-align:center;}
  .w-clock .time{font-family:var(--mono);font-size:min(22vw,180px);font-weight:600;letter-spacing:.02em;line-height:1;}
  .w-clock .date{margin-top:10px;font-size:min(4.5vw,28px);color:var(--muted);text-transform:capitalize;}
  .w-clock .cities{margin-top:18px;font-size:min(2.4vw,16px);color:#5c6b76;font-family:var(--mono);letter-spacing:.03em;}

  .w-weather{text-align:center;padding:20px;}
  .w-weather .icon{font-size:min(28vw,220px);line-height:1;}
  .w-weather .temp{font-family:var(--mono);font-size:min(14vw,110px);font-weight:600;margin-top:4px;}
  .w-weather .desc{font-size:min(5vw,30px);color:var(--muted);margin-top:6px;}
  .w-weather .outlook{display:flex;gap:min(4vw,26px);margin-top:26px;justify-content:center;}
  .w-weather .outlook-day{text-align:center;}
  .w-weather .outlook-day .wd{font-size:min(2.6vw,15px);color:var(--muted);text-transform:capitalize;}
  .w-weather .outlook-day .ic{font-size:min(7vw,42px);line-height:1.3;}
  .w-weather .outlook-day .mm{font-size:min(2.6vw,15px);font-family:var(--mono);color:#9aa7b1;}
  .w-weather .place{font-size:min(3.4vw,18px);color:#4a5560;margin-top:16px;font-family:var(--mono);}

  .w-text{max-width:90vw;text-align:center;white-space:pre-wrap;line-height:1.4;}

  .w-qr{text-align:center;}
  .w-qr img{width:min(70vw,600px);height:min(70vw,600px);border-radius:16px;background:#fff;padding:24px;display:block;margin:0 auto;}
  .w-qr .label{margin-top:24px;font-size:min(5vw,32px);color:var(--fg);}
  .w-qr .wifi-fallback{margin-top:22px;font-family:var(--mono);font-size:min(3.4vw,22px);}
  .w-qr .wifi-fallback .line{margin-top:6px;color:var(--fg);}
  .w-qr .wifi-fallback .line .k{color:var(--muted);}
  .w-qr .wifi-fallback .hint{margin-top:12px;font-size:min(2.4vw,15px);color:var(--muted);font-family:var(--sans);}

  .w-countdown{text-align:center;}
  .w-countdown .title{font-size:min(5vw,32px);color:var(--muted);margin-bottom:22px;}
  .w-countdown .clock{display:flex;gap:min(4vw,32px);justify-content:center;}
  .w-countdown .unit{display:flex;flex-direction:column;align-items:center;}
  .w-countdown .unit .num{font-family:var(--mono);font-size:min(16vw,120px);font-weight:600;line-height:1;}
  .w-countdown .unit .lbl{font-size:min(3vw,18px);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;}
  .w-countdown .done{font-size:min(10vw,80px);font-weight:600;}

  .w-photo{position:fixed;inset:0;background:#000;}
  .w-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1.2s ease;}
  .w-photo img.show{opacity:1;}

  .w-screenshare{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;}
  .w-screenshare img{width:100%;height:100%;object-fit:contain;}

  .w-empty{text-align:center;color:var(--muted);}
  .w-empty .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);display:inline-block;margin-bottom:14px;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  #toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:#12161acc;border:1px solid #2a3138;color:var(--muted);
    padding:8px 14px;border-radius:999px;font-size:12px;font-family:var(--mono);
    opacity:0;transition:opacity .5s ease;pointer-events:none;
  }
  #toast.show{opacity:1;}

  #id-badge{
    position:fixed;right:10px;bottom:10px;z-index:50;
    font-family:var(--mono);font-size:11px;color:#55606a;
    background:#0d1114cc;border:1px solid #23292f;padding:3px 9px;border-radius:999px;
    letter-spacing:.05em;pointer-events:none;display:none;
  }
  #id-badge.show{display:block;}
</style>
</head>
<body>
<div id="app">
  <div class="setup" id="setup">
    <div class="badge">SCREENLIVE · DISPLEJ</div>
    <h1>Připojit tuto obrazovku</h1>
    <p>Naskenuj párovací QR kód v administraci na počítači. Pokud tento telefon nemá fotoaparát, vlož párovací odkaz nebo kód ručně níže.</p>
    <label>Párovací odkaz nebo kód</label>
    <input id="in-token" placeholder="vlož odkaz z administrace" autocomplete="off">
    <button id="btn-connect">Připojit obrazovku</button>
    <div class="err" id="setup-err"></div>
  </div>

  <div id="stage"></div>
</div>
<div id="toast"></div>
<div id="id-badge"></div>

<script>
(function(){
  "use strict";

  var LS_KEY = "screenwall_lite_device_cfg";
  var stage = document.getElementById('stage');
  var setupEl = document.getElementById('setup');
  var toastEl = document.getElementById('toast');

  function toast(msg, ms){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, ms || 2600);
  }

  function qs(name){
    var m = new RegExp('[?&]'+name+'=([^&]+)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function extractToken(input){
    input = (input || '').trim();
    var m = /[?&]token=([^&]+)/.exec(input);
    if(m) return decodeURIComponent(m[1]);
    return input;
  }

  function loadCfg(){
    try{ return JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ return null; }
  }
  function saveCfg(cfg){ localStorage.setItem(LS_KEY, JSON.stringify(cfg)); }
  function clearCfg(){ localStorage.removeItem(LS_KEY); }

  function api(method, path, body){
    return fetch(path, {
      method: method,
      headers: body !== undefined ? {'Content-Type':'application/json'} : undefined,
      body: body !== undefined ? JSON.stringify(body) : undefined
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(data){
        return {ok: r.ok, status: r.status, data: data};
      });
    });
  }

  // ---------- Wake lock (+ old-browser fallback) ----------
  var wakeLock = null;
  function keepAwake(){
    if('wakeLock' in navigator){
      navigator.wakeLock.request('screen').then(function(wl){
        wakeLock = wl;
      }).catch(function(){ startVideoFallback(); });
      document.addEventListener('visibilitychange', function(){
        if(document.visibilityState === 'visible' && !wakeLock){
          navigator.wakeLock.request('screen').then(function(wl){ wakeLock = wl; }).catch(function(){});
        }
      });
    } else {
      startVideoFallback();
    }
  }
  function startVideoFallback(){
    var v = document.createElement('video');
    v.setAttribute('playsinline','');
    v.muted = true; v.loop = true; v.autoplay = true;
    v.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;';
    v.src = 'data:video/mp4;base64,AAAAHGZ0eXBpc29tAAACAGlzb21pc28yYXZjMQAAAAhmcmVlAAAAym1kYXQAAAAoAWWNb1pRAgIJx6jgAAAADAAAAgAgICBAECAg';
    document.body.appendChild(v);
    v.play().catch(function(){});
  }

  // ---------- Widget rendering ----------
  var cleanup = null;
  function renderWidget(widget){
    if(cleanup){ try{ cleanup(); }catch(e){} cleanup = null; }
    stage.className = 'on';
    if(!widget || !widget.type){ return renderEmpty(); }
    if(widget.type === 'clock') return renderClock(widget.config||{});
    if(widget.type === 'weather') return renderWeather(widget.config||{});
    if(widget.type === 'photo') return renderPhoto(widget.config||{});
    if(widget.type === 'text') return renderText(widget.config||{});
    if(widget.type === 'screenshare') return renderScreenshare();
    if(widget.type === 'qr') return renderQr(widget.config||{});
    if(widget.type === 'countdown') return renderCountdown(widget.config||{});
    return renderEmpty();
  }

  function renderEmpty(){
    stage.innerHTML = '<div class="w-empty"><span class="dot"></span><div>Obrazovka je připojená.<br>Čeká na přiřazení widgetu v administraci.</div></div>';
  }

  function renderClock(cfg){
    var citiesHtml = (cfg.cities && cfg.cities.length) ? '<div class="cities" id="ck-cities"></div>' : '';
    stage.innerHTML = '<div class="w-clock"><div class="time" id="ck-time"></div><div class="date" id="ck-date"></div>' + citiesHtml + '</div>';
    var t = document.getElementById('ck-time'), d = document.getElementById('ck-date');
    var citiesEl = document.getElementById('ck-cities');
    var h24 = cfg.format !== '12';
    function tick(){
      var now = new Date();
      t.textContent = now.toLocaleTimeString('cs-CZ', h24 ? {hour:'2-digit',minute:'2-digit'} : {hour:'2-digit',minute:'2-digit',hour12:true});
      d.textContent = now.toLocaleDateString('cs-CZ', {weekday:'long', day:'numeric', month:'long'});
      if(citiesEl && cfg.cities && cfg.cities.length){
        citiesEl.textContent = cfg.cities.map(function(c){
          try{
            var timeStr = now.toLocaleTimeString('cs-CZ', {hour:'2-digit',minute:'2-digit', timeZone: c.tz});
            return c.name + ' ' + timeStr;
          }catch(e){ return c.name + ' –'; }
        }).join('   ·   ');
      }
    }
    tick();
    var iv = setInterval(tick, 1000);
    cleanup = function(){ clearInterval(iv); };
  }

  function renderWeather(cfg){
    var lat = cfg.lat || 49.7475, lon = cfg.lon || 13.3776, place = cfg.place || 'Plzeň';
    stage.innerHTML = '<div class="w-weather"><div class="icon" id="wx-icon">·</div><div class="temp" id="wx-temp">–°</div><div class="desc" id="wx-desc">Načítám počasí…</div><div class="outlook" id="wx-outlook"></div><div class="place">' + place + '</div></div>';
    var WMO = {0:['jasno','☀️'],1:['skoro jasno','🌤️'],2:['polojasno','⛅'],3:['zataženo','☁️'],
      45:['mlha','🌫️'],48:['mlha, jinovatka','🌫️'],
      51:['slabé mrholení','🌦️'],53:['mrholení','🌦️'],55:['silné mrholení','🌧️'],
      56:['mrznoucí mrholení','🌧️'],57:['silné mrznoucí mrholení','🌧️'],
      61:['slabý déšť','🌦️'],63:['déšť','🌧️'],65:['silný déšť','🌧️'],
      66:['mrznoucí déšť','🌧️'],67:['silný mrznoucí déšť','🌧️'],
      71:['slabé sněžení','🌨️'],73:['sněžení','🌨️'],75:['silné sněžení','❄️'],77:['sněhové zrno','❄️'],
      80:['přeháňky','🌦️'],81:['silnější přeháňky','🌧️'],82:['prudké přeháňky','⛈️'],
      85:['sněhové přeháňky','🌨️'],86:['silné sněhové přeháňky','❄️'],
      95:['bouřka','⛈️'],96:['bouřka s kroupami','⛈️'],99:['silná bouřka s kroupami','⛈️']};
    function load(){
      var url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=5&timezone=Europe%2FPrague';
      fetch(url).then(function(r){return r.json();}).then(function(data){
        var c = data.current || {};
        var wmo = WMO[c.weather_code] || ['neznámo','🌡️'];
        var iconEl = document.getElementById('wx-icon');
        var tempEl = document.getElementById('wx-temp');
        var descEl = document.getElementById('wx-desc');
        if(iconEl) iconEl.textContent = wmo[1];
        if(tempEl) tempEl.textContent = Math.round(c.temperature_2m) + '°C';
        if(descEl) descEl.textContent = wmo[0] + ' · vítr ' + Math.round(c.wind_speed_10m) + ' km/h';
        var outlookEl = document.getElementById('wx-outlook');
        if(outlookEl && data.daily && data.daily.time && data.daily.time.length > 1){
          var days = data.daily.time.slice(1, 5);
          var codes = data.daily.weather_code.slice(1, 5);
          var maxs = data.daily.temperature_2m_max.slice(1, 5);
          var mins = data.daily.temperature_2m_min.slice(1, 5);
          outlookEl.innerHTML = days.map(function(dateStr, i){
            var dd = new Date(dateStr + 'T12:00:00');
            var wd = dd.toLocaleDateString('cs-CZ', {weekday:'short'});
            var w = WMO[codes[i]] || ['', '🌡️'];
            return '<div class="outlook-day"><div class="wd">'+wd+'</div><div class="ic">'+w[1]+'</div><div class="mm">'+Math.round(maxs[i])+'°/'+Math.round(mins[i])+'°</div></div>';
          }).join('');
        }
      }).catch(function(){
        var descEl = document.getElementById('wx-desc');
        if(descEl) descEl.textContent = 'Počasí se nepodařilo načíst';
      });
    }
    load();
    var iv = setInterval(load, 10*60*1000);
    cleanup = function(){ clearInterval(iv); };
  }

  function renderPhoto(cfg){
    var images = (cfg.images || []).filter(Boolean);
    stage.innerHTML = '<div class="w-photo" id="ph-wrap"></div>';
    var wrap = document.getElementById('ph-wrap');
    if(!images.length){
      wrap.innerHTML = '<div class="w-empty" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">Fotorámeček nemá žádné obrázky.<br>Doplň URL adresy v administraci.</div>';
      return;
    }
    var a = document.createElement('img'), b = document.createElement('img');
    wrap.appendChild(a); wrap.appendChild(b);
    var idx = 0, showingA = true;
    function step(){
      var img = showingA ? b : a;
      var old = showingA ? a : b;
      img.onload = function(){
        img.classList.add('show');
        old.classList.remove('show');
      };
      img.src = images[idx % images.length];
      idx++; showingA = !showingA;
    }
    step();
    var iv = setInterval(step, (cfg.interval || 10) * 1000);
    cleanup = function(){ clearInterval(iv); };
  }

  function renderText(cfg){
    var size = cfg.fontSize || 42;
    stage.innerHTML = '<div class="w-text" style="font-size:'+size+'px;">' +
      (cfg.text || 'Textová deska je prázdná.').replace(/</g,'&lt;') + '</div>';
  }

  function renderScreenshare(){
    stage.innerHTML = '<div class="w-screenshare" id="ss-wrap"><div class="w-empty" id="ss-empty"><span class="dot"></span><div>Čeká se, až prezentující spustí sdílení obrazovky.</div></div></div>';
  }

  function updateScreenshareFrame(frame){
    var wrap = document.getElementById('ss-wrap');
    if(!wrap) return;
    if(!frame){
      if(!document.getElementById('ss-empty')){
        wrap.innerHTML = '<div class="w-empty" id="ss-empty"><span class="dot"></span><div>Čeká se, až prezentující spustí sdílení obrazovky.</div></div>';
      }
      return;
    }
    var img = wrap.querySelector('img');
    if(!img){
      wrap.innerHTML = '<img alt="Sdílená obrazovka">';
      img = wrap.querySelector('img');
    }
    img.src = frame;
  }

  function wifiEscape(s){
    return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/:/g,'\\:').replace(/"/g,'\\"');
  }

  function buildWifiQrContent(cfg){
    var ssid = cfg.ssid || '';
    if(!ssid) return '';
    var security = cfg.security === 'WEP' ? 'WEP' : (cfg.security === 'nopass' ? 'nopass' : 'WPA');
    var passPart = security === 'nopass' ? '' : ('P:' + wifiEscape(cfg.wifiPassword || '') + ';');
    return 'WIFI:T:' + security + ';S:' + wifiEscape(ssid) + ';' + passPart + ';';
  }

  function vcardEscape(s){
    return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  }

  function buildVCardContent(cfg){
    var fullName = cfg.fullName || '';
    if(!fullName) return '';
    var lines = ['BEGIN:VCARD', 'VERSION:3.0'];
    lines.push('N:' + vcardEscape(fullName) + ';;;;');
    lines.push('FN:' + vcardEscape(fullName));
    if(cfg.org) lines.push('ORG:' + vcardEscape(cfg.org));
    if(cfg.jobTitle) lines.push('TITLE:' + vcardEscape(cfg.jobTitle));
    if(cfg.phone) lines.push('TEL;TYPE=CELL:' + vcardEscape(cfg.phone));
    if(cfg.email) lines.push('EMAIL:' + vcardEscape(cfg.email));
    if(cfg.website) lines.push('URL:' + vcardEscape(cfg.website));
    lines.push('END:VCARD');
    return lines.join('\n');
  }

  function renderQr(cfg){
    var content = cfg.mode === 'wifi' ? buildWifiQrContent(cfg)
      : cfg.mode === 'vcard' ? buildVCardContent(cfg)
      : (cfg.url || '');
    var label = cfg.label || '';
    if(!content){
      var msg = cfg.mode === 'wifi' ? 'Chybí název Wi-Fi sítě.<br>Doplň ho v administraci.'
        : cfg.mode === 'vcard' ? 'Chybí jméno na vizitce.<br>Doplň ho v administraci.'
        : 'QR kód nemá vyplněný obsah.<br>Doplň adresu nebo text v administraci.';
      stage.innerHTML = '<div class="w-empty"><span class="dot"></span><div>'+msg+'</div></div>';
      return;
    }
    var qrImgUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=' + encodeURIComponent(content);
    var fallback = '';
    if(cfg.mode === 'wifi'){
      var ssidText = (cfg.ssid || '').replace(/</g,'&lt;');
      var passLine = cfg.security === 'nopass' ? '' :
        '<div class="line"><span class="k">Heslo:</span> '+(cfg.wifiPassword || '').replace(/</g,'&lt;')+'</div>';
      fallback = '<div class="wifi-fallback">' +
        '<div class="line"><span class="k">Síť:</span> '+ssidText+'</div>' +
        passLine +
        '<div class="hint">Nejde naskenovat? Připoj se ručně s údaji výše.</div>' +
        '</div>';
    } else if(cfg.mode === 'vcard'){
      var esc = function(s){ return (s||'').replace(/</g,'&lt;'); };
      var vlines = [];
      if(cfg.org) vlines.push('<div class="line">'+esc(cfg.org)+(cfg.jobTitle?' &middot; '+esc(cfg.jobTitle):'')+'</div>');
      else if(cfg.jobTitle) vlines.push('<div class="line">'+esc(cfg.jobTitle)+'</div>');
      if(cfg.phone) vlines.push('<div class="line"><span class="k">Tel:</span> '+esc(cfg.phone)+'</div>');
      if(cfg.email) vlines.push('<div class="line"><span class="k">E-mail:</span> '+esc(cfg.email)+'</div>');
      if(cfg.website) vlines.push('<div class="line"><span class="k">Web:</span> '+esc(cfg.website)+'</div>');
      fallback = '<div class="wifi-fallback">' +
        '<div class="line" style="font-size:1.15em;font-weight:600;">'+esc(cfg.fullName)+'</div>' +
        vlines.join('') +
        '<div class="hint">Nejde naskenovat? Kontaktní údaje jsou výše.</div>' +
        '</div>';
    }
    stage.innerHTML = '<div class="w-qr"><img src="'+qrImgUrl+'" alt="QR kód">' +
      (label ? '<div class="label">'+label.replace(/</g,'&lt;')+'</div>' : '') +
      fallback + '</div>';
  }

  function renderCountdown(cfg){
    var target = cfg.target ? new Date(cfg.target).getTime() : null;
    var title = cfg.title || '';
    var doneText = cfg.doneText || 'Začínáme!';
    stage.innerHTML = '<div class="w-countdown">' +
      (title ? '<div class="title">'+title.replace(/</g,'&lt;')+'</div>' : '') +
      '<div class="clock" id="cd-clock"></div>' +
      '</div>';
    var clockEl = document.getElementById('cd-clock');
    function pad(n){ return (n<10?'0':'')+n; }
    function tick(){
      if(!target || isNaN(target)){ clockEl.innerHTML = '<div class="done">Cíl není nastaven.</div>'; return; }
      var diff = target - Date.now();
      if(diff <= 0){
        clockEl.innerHTML = '<div class="done">'+doneText.replace(/</g,'&lt;')+'</div>';
        return;
      }
      var d = Math.floor(diff / 86400000);
      var h = Math.floor(diff % 86400000 / 3600000);
      var m = Math.floor(diff % 3600000 / 60000);
      var s = Math.floor(diff % 60000 / 1000);
      clockEl.innerHTML =
        '<div class="unit"><span class="num">'+d+'</span><span class="lbl">dní</span></div>' +
        '<div class="unit"><span class="num">'+pad(h)+'</span><span class="lbl">hod</span></div>' +
        '<div class="unit"><span class="num">'+pad(m)+'</span><span class="lbl">min</span></div>' +
        '<div class="unit"><span class="num">'+pad(s)+'</span><span class="lbl">sek</span></div>';
    }
    tick();
    var iv = setInterval(tick, 1000);
    cleanup = function(){ clearInterval(iv); };
  }

  // ---------- Connection / polling loop ----------
  var lastWidgetJSON = null;
  var currentWidgetType = null;
  var framePollTimer = null;

  function stopFramePoll(){
    if(framePollTimer){ clearInterval(framePollTimer); framePollTimer = null; }
  }

  function startFramePoll(uid, wall){
    stopFramePoll();
    function pull(){
      fetch('/api/broadcast?uid=' + encodeURIComponent(uid) + '&wall=' + encodeURIComponent(wall))
        .then(function(r){ return r.json(); })
        .then(function(data){ updateScreenshareFrame(data && data.frame); })
        .catch(function(){});
    }
    pull();
    framePollTimer = setInterval(pull, 1000);
  }

  function startLoop(cfg){
    setupEl.style.display = 'none';
    var badge = document.getElementById('id-badge');
    badge.textContent = 'ID ' + cfg.deviceId.slice(-4).toUpperCase();
    badge.classList.add('show');

    function tick(){
      var url = '/api/device-sync?id=' + encodeURIComponent(cfg.deviceId) + '&token=' + encodeURIComponent(cfg.deviceToken);
      api('GET', url).then(function(res){
        if(res.status === 404 || res.data.removed){
          toast('Zařízení bylo v administraci odebráno.');
          clearCfg();
          setTimeout(function(){ location.reload(); }, 2500);
          return;
        }
        if(!res.ok){ return; /* offline blip or server hiccup, retry next tick */ }
        var widget = res.data.widget;
        var wJSON = JSON.stringify(widget || null);
        if(wJSON !== lastWidgetJSON){
          lastWidgetJSON = wJSON;
          renderWidget(widget);
        }
        var newType = widget && widget.type;
        if(newType === 'screenshare'){
          if(currentWidgetType !== 'screenshare'){
            startFramePoll(widget.config.uid, widget.config.wall);
          }
        } else if(currentWidgetType === 'screenshare'){
          stopFramePoll();
        }
        currentWidgetType = newType;
      }).catch(function(){ /* network blip, retry next tick */ });
    }
    tick();
    setInterval(tick, 4000);
  }

  function connect(rawInput){
    var errEl = document.getElementById('setup-err');
    errEl.textContent = '';
    var token = extractToken(rawInput);
    if(!token){ errEl.textContent = 'Vlož párovací odkaz nebo kód.'; return; }
    api('POST', '/api/pair', {
      token: token,
      resolution: screen.width + '×' + screen.height,
      ua: navigator.userAgent.slice(0,140)
    }).then(function(res){
      if(!res.ok){
        errEl.textContent = res.data.error || 'Párování se nepodařilo.';
        return;
      }
      var cfg = { deviceId: res.data.deviceId, deviceToken: res.data.deviceToken };
      saveCfg(cfg);
      startLoop(cfg);
    }).catch(function(e){
      errEl.textContent = 'Nepodařilo se připojit: ' + e.message;
    });
  }

  // ---------- Boot ----------
  function boot(){
    keepAwake();
    var saved = loadCfg();
    if(saved && saved.deviceId && saved.deviceToken){
      startLoop(saved);
      return;
    }
    var tokenFromUrl = qs('token');
    if(tokenFromUrl){
      connect(tokenFromUrl);
      return;
    }
    setupEl.style.display = 'block';
    document.getElementById('btn-connect').addEventListener('click', function(){
      connect(document.getElementById('in-token').value);
    });
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
